name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data-and-display-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Synthetic data and access-boundary tests
        run: python3 -m unittest discover -s tests -v
  native-build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Native model and isolated request tests
        run: zsh scripts/test-native.sh
      - name: Build native application
        run: zsh scripts/build-macos.sh
