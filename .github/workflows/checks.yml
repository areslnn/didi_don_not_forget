name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Synthetic data and access-boundary tests
        run: python3 -m unittest discover -s tests -v
      - name: Build native application
        run: zsh scripts/build-macos.sh
